projects:
  - name: Agronos
    context: Διπλωματική MSc, σε ενεργή ανάπτυξη
    period: 2025 — Σήμερα
    summary: Πολυενοικιακή (multi-tenant) πλατφόρμα Έξυπνης Γεωργίας. Οι αγρότες οργανώνουν τα αγροτεμάχιά τους σε ζώνες, καταγράφουν φυτεύσεις καλλιεργειών και εγκαθιστούν κόμβους αισθητήρων ESP32 που μεταδίδουν μέσω WiFi ή, μέσω ενός ειδικά σχεδιασμένου gateway, LoRa μεγάλης εμβέλειας. Οι μετρήσεις περνούν από broker MQTT (EMQX) με κανόνες πρόσβασης ανά χρήστη και αποθηκεύονται σε InfluxDB, η διεπαφή Vue ενημερώνεται σε πραγματικό χρόνο μέσω WebSockets (Laravel Reverb), και οι συσκευές εκτός σύνδεσης ή με χαμηλή μπαταρία δημιουργούν ειδοποιήσεις. Το υλικολογισμικό των ESP32 είναι αρθρωτό, σε C++, με ρύθμιση WiFi μέσω captive portal και deep sleep. Ελέγχεται με Pest (feature και browser tests).
    stack: [Laravel 13, Vue, Inertia, MariaDB, InfluxDB, MQTT (EMQX), Reverb, ESP32 / C++, LoRa, Pest]
    links:
      - label: Πλατφόρμα
        url: https://github.com/gkalogeitonas/agronos
      - label: Υλικολογισμικό συσκευής IoT
        url: https://github.com/gkalogeitonas/Agronos-iot-device
      - label: ESP32 LoRa gateway
        url: https://github.com/gkalogeitonas/ESP32-LoRa-to-Internet-Gateway

  - name: CartGPT
    context: EnterID Solutions
    period: 2025 — 2026
    summary: Υπηρεσία AI για τον εμπλουτισμό του περιεχομένου προϊόντων στο OpenCart. Ένα συνοδευτικό extension του OpenCart στέλνει τα δεδομένα των προϊόντων σε ένα Laravel API, που παράγει βελτιωμένες, πολύγλωσσες περιγραφές μέσω των κλειδιών AI provider του κάθε χρήστη.
    stack: [Laravel 12, Vue, Inertia, Prism, OpenAI, OpenCart]

  - name: Citrus Manager
    context: EnterID Solutions
    period: "2026"
    summary: Εφαρμογή back-office για επιχείρηση εμπορίας εσπεριδοειδών. Καταγράφει πελάτες, πωλήσεις, παραδόσεις και εισπράξεις, και υπολογίζει σε πραγματικό χρόνο το υπόλοιπο κάθε πελάτη.
    stack: [Laravel 13, Inertia, Vue, Docker]

  - name: laraPMS
    context: Προσωπικό project
    period: 2024 — Σήμερα
    summary: Πολυενοικιακό (multi-tenant) σύστημα διαχείρισης ακινήτων για ακίνητα, δωμάτια και κρατήσεις, με ημερολόγιο κρατήσεων, αλλαγές κρατήσεων, εντοπισμό overbooking και πληρωμές.
    stack: [Laravel 13, Inertia, Vue, Tailwind CSS, Pest]
    links:
      - label: GitHub
        url: https://github.com/gkalogeitonas/laraPMS

