profile:
  - Full-stack developer με μεταπτυχιακό στα Συστήματα Κινητού και Διάχυτου Υπολογισμού και βασικές σπουδές στις Εφαρμοσμένες Μαθηματικές και Φυσικές Επιστήμες (ΕΜΠ).
  - Από το 2013 αναπτύσσω και συντηρώ ηλεκτρονικά καταστήματα OpenCart στην EnterID Solutions και τα διασυνδέω με ελληνικά ERP και feeds προμηθευτών. Πιο πρόσφατα αναπτύσσω και εφαρμογές σε Laravel + Vue, όπως μια υπηρεσία AI που γράφει περιεχόμενο προϊόντων για ηλεκτρονικά καταστήματα.
  - Στη διπλωματική μου εργασία σχεδίασα και υλοποίησα το Agronos, μια πλατφόρμα Έξυπνης Γεωργίας σε Laravel + Vue, με κόμβους αισθητήρων ESP32 που επικοινωνούν μέσω WiFi και LoRa, και συνεχίζω να την αναπτύσσω.

experience:
  - role: Full Stack Developer
    company: EnterID Solutions
    period: 2013 — Σήμερα
    points:
      - Ανάπτυξη, συντήρηση και επέκταση 50+ ηλεκτρονικών καταστημάτων πελατών στο OpenCart, από την έκδοση 1.5 έως την 3.x.
      - Σχεδιασμός εσωτερικού framework για importers (λήψη και ανάλυση feeds, αντιστοίχιση πεδίων με ρυθμίσεις από το admin), στο οποίο βασίζονται πλέον 50+ importers προμηθευτών σε 10+ καταστήματα.
      - "Διασυνδέσεις του OpenCart με ελληνικά ERP: SoftOne, Galaxy και Entersoft."
      - "Ανάπτυξη 100+ εξειδικευμένων extensions και τροποποιήσεων για το OpenCart: αποστολή, πληρωμή, αποδείξεις και τιμολόγια, και εκπτώσεις."
      - Ανάπτυξη και συντήρηση ιστοσελίδων σε Drupal 7, μεταξύ των οποίων περιφερειακά ειδησεογραφικά sites.

  - role: Web Developer
