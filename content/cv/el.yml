beyond:
  text: Στον ελεύθερο χρόνο μου φτιάχνω projects physical computing και IoT με μικροελεγκτές όπως ATmega, STM32, ESP8266 και ESP32. Μου αρέσει επίσης να δίνω μορφή σε ιδέες με προσθετική (3D εκτύπωση) και αφαιρετική κατασκευή (CNC).
  tags: [IoT, ESP32, STM32, ATmega, 3D εκτύπωση, CNC]

