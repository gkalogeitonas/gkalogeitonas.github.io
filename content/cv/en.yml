profile:
  - Full-stack developer with an MSc in Pervasive and Mobile Computing Systems and a background in Applied Mathematics and Physics (NTUA).
  - "Since 2013 I build and maintain OpenCart e-commerce platforms at EnterID Solutions: custom shipping, payment and analytics extensions, automated product importers and feeds, and integrations with Greek ERPs such as SoftOne, Galaxy, Entersoft and Pylon."
  - For my MSc thesis I designed and built Agronos, a Laravel + Vue platform for smart agriculture with ESP32 sensor nodes reporting over WiFi and LoRa.

experience:
  - role: Full Stack Developer
    company: EnterID Solutions
    period: 2013 — Present
    points:
      - Construction, maintenance, and expansion of online stores based on the OpenCart platform (all versions).
      - "Building interconnections between OpenCart and the most popular Greek ERPs: SoftOne, Galaxy, Entersoft and Pylon."
      - Building tailor-made shipping, payment, analytics, and other extensions for our clients.
      - Building automated product importers from manufacturer feeds (XML or JSON).
      - Building product feeds for eCommerce aggregators.
      - Website development on Drupal 7.
      - Building web applications with PHP, SQL, and JavaScript.

  - role: Web Developer
    company: Freelancer
    period: 2008 — 2014
    points:
      - Built various private projects with PHP and MySQL, static sites as freelance jobs, and Drupal websites as an outsourcing partner to other companies.

  - role: High School Teacher
    company: 2nd High School of Naxos
    period: Apr 2013 — Jun 2013
    points:
      - Teaching Mathematics at the 2nd High School of Naxos, Greece.

