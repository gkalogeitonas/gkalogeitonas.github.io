profile:
  - Full-stack developer with an MSc in Pervasive and Mobile Computing Systems and a background in Applied Mathematics and Physics (NTUA).
  - Since 2013 I have been building and maintaining OpenCart e-commerce platforms at EnterID Solutions, connecting them to Greek ERPs and supplier feeds. More recently I also build Laravel + Vue applications, including an AI service that writes product content for online stores.
  - For my MSc thesis I designed and built Agronos, a Laravel + Vue platform for smart agriculture with ESP32 sensor nodes reporting over WiFi and LoRa, and I keep developing it.

