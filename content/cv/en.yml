projects:
  - name: Agronos
    context: MSc thesis, actively developed
    period: 2025 — Present
    summary: Multi-tenant smart agriculture platform. Farmers organise their farms into zones, record crop plantings and deploy ESP32 sensor nodes that report over WiFi or, through a custom gateway, long-range LoRa. Readings flow through an EMQX MQTT broker with per-user access rules into InfluxDB, the Vue UI updates live over WebSockets (Laravel Reverb), and offline devices or low batteries raise alerts. The ESP32 firmware is modular C++ with captive-portal WiFi setup and deep sleep. Tested with Pest feature and browser tests.
    stack: [Laravel 13, Vue, Inertia, MariaDB, InfluxDB, MQTT (EMQX), Reverb, ESP32 / C++, LoRa, Pest]
    links:
      - label: Platform
        url: https://github.com/gkalogeitonas/agronos
      - label: IoT device firmware
        url: https://github.com/gkalogeitonas/Agronos-iot-device
      - label: ESP32 LoRa gateway
        url: https://github.com/gkalogeitonas/ESP32-LoRa-to-Internet-Gateway

  - name: CartGPT
    context: EnterID Solutions
    period: 2025 — 2026
    summary: AI service that enriches OpenCart product content. A companion OpenCart extension sends product data to a Laravel API, which generates improved, multilingual product descriptions through each user's own AI provider keys.
    stack: [Laravel 12, Vue, Inertia, Prism, OpenAI, OpenCart]

  - name: Citrus Manager
    context: EnterID Solutions
    period: "2026"
    summary: Back-office application for a citrus trading business. It records customers, sales and deliveries, and payments, and shows each customer's balance computed live from them.
    stack: [Laravel 13, Inertia, Vue, Docker]

  - name: laraPMS
    context: Personal project
    period: 2024 — Present
    summary: Multi-tenant property management system for properties, rooms and bookings, with a booking calendar, rescheduling, overbooking detection and payments.
    stack: [Laravel 13, Inertia, Vue, Tailwind CSS, Pest]
    links:
      - label: GitHub
        url: https://github.com/gkalogeitonas/laraPMS

